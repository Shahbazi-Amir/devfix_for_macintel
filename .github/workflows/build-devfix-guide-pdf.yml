name: Build DevFix Persian Guide PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/bootstrap/build-devfix-guide-pdf.trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-hosny-amiri fonts-dejavu-core
          python3 -m pip install --upgrade pip
          python3 -m pip install "weasyprint==68.0" markdown

      - name: Build PDF
        run: |
          python3 scripts/build_devfix_guide_pdf.py
          test -s docs/DevFix_User_Guide_FA.pdf
          sha256sum docs/DevFix_User_Guide_FA.pdf

      - name: Commit PDF and cleanup trigger/workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/bootstrap/build-devfix-guide-pdf.trigger
          rm -f .github/workflows/build-devfix-guide-pdf.yml
          git add docs/DevFix_User_Guide_FA.pdf scripts/build_devfix_guide_pdf.py .github/bootstrap .github/workflows
          git commit -m "docs: add generated Persian DevFix PDF guide"
          git push origin HEAD:main
