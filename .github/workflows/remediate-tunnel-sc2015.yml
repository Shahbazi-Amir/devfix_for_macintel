name: Remediate Tunnel SC2015

on:
  push:
    branches: [feature/devfix-tunnel]
    paths:
      - ".github/bootstrap/remediate-tunnel-sc2015.trigger"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python3 scripts/remediate_tunnel_sc2015.py

      - name: Syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tunnel/pkg/preinstall tunnel/pkg/postinstall tunnel/portable-install.sh tunnel/uninstall.sh tests/test_devfix_tunnel.sh
          shellcheck -x tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tunnel/pkg/preinstall tunnel/pkg/postinstall tunnel/portable-install.sh tunnel/uninstall.sh tests/test_devfix_tunnel.sh

      - name: Run unchanged Tunnel integration tests
        run: bash tests/test_devfix_tunnel.sh

      - name: Commit remediation and clean one-shot files
        run: |
          rm -f .github/bootstrap/remediate-tunnel-sc2015.trigger
          rm -f .github/workflows/remediate-tunnel-sc2015.yml
          rm -f scripts/remediate_tunnel_sc2015.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/fetch-tor-bundle.sh tunnel/uninstall.sh docs/tunnel/remediations .github/bootstrap .github/workflows scripts
          git commit -m "fix(tunnel): make shell control flow explicit"
          git push origin HEAD:feature/devfix-tunnel
