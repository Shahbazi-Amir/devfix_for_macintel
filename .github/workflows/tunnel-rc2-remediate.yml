name: DevFix Tunnel RC2 Remediation

on:
  push:
    branches: [feature/devfix-tunnel]
    paths: [".github/workflows/tunnel-rc2-remediate.yml"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/devfix-tunnel
          fetch-depth: 0

      - name: Apply RC2 remediation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, got {count}")
              write(path, text.replace(old, new, 1))

          cli = Path("tunnel/cli/devfix-tunnel")
          s = cli.read_text()
          replacements = [
              ('TUNNEL_VERSION="0.3.0-rc1"', 'TUNNEL_VERSION="0.3.0-rc2"'),
              ('MAX_AUTO_ATTEMPTS="${DEVFIX_TUNNEL_MAX_AUTO_ATTEMPTS:-5}"', 'MAX_AUTO_ATTEMPTS="${DEVFIX_TUNNEL_MAX_AUTO_ATTEMPTS:-0}"'),
              ('GeoIPExcludeUnknown 1\nExcludeExitNodes {ir},{??}', 'GeoIPExcludeUnknown 0\nExcludeExitNodes {ir},{??}'),
              ('if [ "$requested_transport" = "auto" ] && [ "$attempt_no" -gt "$MAX_AUTO_ATTEMPTS" ]; then break; fi', 'if [ "$requested_transport" = "auto" ] && [ "$MAX_AUTO_ATTEMPTS" -gt 0 ] && [ "$attempt_no" -gt "$MAX_AUTO_ATTEMPTS" ]; then break; fi'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"CLI expected pattern missing: {old}")
              s = s.replace(old, new, 1)

          old = 'STALL_TIMEOUT="${DEVFIX_TUNNEL_STALL_TIMEOUT:-90}"\nVALIDATION_TIMEOUT="${DEVFIX_TUNNEL_VALIDATION_TIMEOUT:-30}"'
          new = 'STALL_TIMEOUT_OVERRIDE="${DEVFIX_TUNNEL_STALL_TIMEOUT:-}"\nSTALL_TIMEOUT="${DEVFIX_TUNNEL_STALL_TIMEOUT:-90}"\nSTALL_TIMEOUT_HANDSHAKE="${DEVFIX_TUNNEL_STALL_TIMEOUT_HANDSHAKE:-150}"\nSTALL_TIMEOUT_CONSENSUS="${DEVFIX_TUNNEL_STALL_TIMEOUT_CONSENSUS:-240}"\nVALIDATION_TIMEOUT="${DEVFIX_TUNNEL_VALIDATION_TIMEOUT:-30}"'
          if old not in s:
              raise SystemExit("CLI stall constant insertion point missing")
          s = s.replace(old, new, 1)

          old = 'TOR_CHECK_URL="${DEVFIX_TUNNEL_TOR_CHECK_URL:-https://check.torproject.org/api/ip}"\n\ninfo()'
          new = 'TOR_CHECK_URL="${DEVFIX_TUNNEL_TOR_CHECK_URL:-https://check.torproject.org/api/ip}"\n\ncase "$MAX_AUTO_ATTEMPTS" in \'\'|*[!0-9]*) MAX_AUTO_ATTEMPTS=0 ;; esac\n\ninfo()'
          if old not in s:
              raise SystemExit("CLI auto-attempt validation insertion point missing")
          s = s.replace(old, new, 1)

          old = '''bootstrap_percent_from_log() {
  file="$1"
  [ -f "$file" ] || { printf '0'; return; }
  value=$(sed -nE 's/.*Bootstrapped ([0-9]+)%.*/\\1/p' "$file" | tail -n 1)
  case "$value" in ''|*[!0-9]*) printf '0' ;; *) printf '%s' "$value" ;; esac
}

classify_attempt_failure() {'''
          new = '''bootstrap_percent_from_log() {
  file="$1"
  [ -f "$file" ] || { printf '0'; return; }
  value=$(sed -nE 's/.*Bootstrapped ([0-9]+)%.*/\\1/p' "$file" | tail -n 1)
  case "$value" in ''|*[!0-9]*) printf '0' ;; *) printf '%s' "$value" ;; esac
}

stall_timeout_for_percent() {
  percent="$1"
  if [ -n "$STALL_TIMEOUT_OVERRIDE" ]; then
    printf '%s' "$STALL_TIMEOUT"
  elif [ "$percent" -ge 25 ] 2>/dev/null; then
    printf '%s' "$STALL_TIMEOUT_CONSENSUS"
  elif [ "$percent" -ge 10 ] 2>/dev/null; then
    printf '%s' "$STALL_TIMEOUT_HANDSHAKE"
  else
    printf '%s' "$STALL_TIMEOUT"
  fi
}

classify_attempt_failure() {'''
          if old not in s:
              raise SystemExit("CLI bootstrap helper insertion point missing")
          s = s.replace(old, new, 1)

          old = '''  if [ "$transport" = "snowflake" ] && grep -q 'timeout waiting for DataChannel.OnOpen' "$file" 2>/dev/null; then
    printf 'SNOWFLAKE_WEBRTC_DATACHANNEL_FAILURE'
  elif [ "$transport" = "snowflake" ] && grep -q 'broker failure' "$file" 2>/dev/null; then'''
          new = '''  if grep -q 'Not using bridge at .*it is in ExcludeNodes' "$file" 2>/dev/null; then
    printf 'BRIDGE_EXCLUDED_BY_NODE_POLICY'
  elif [ "$transport" = "snowflake" ] && grep -q 'timeout waiting for DataChannel.OnOpen' "$file" 2>/dev/null; then
    printf 'SNOWFLAKE_WEBRTC_DATACHANNEL_FAILURE'
  elif [ "$transport" = "snowflake" ] && grep -q 'broker failure' "$file" 2>/dev/null; then'''
          if old not in s:
              raise SystemExit("CLI failure classifier insertion point missing")
          s = s.replace(old, new, 1)

          old = '''    if [ $(( $(now_epoch) - last_progress_epoch )) -ge "$STALL_TIMEOUT" ]; then
      classification=$(classify_attempt_failure "$transport" "$attempt_log" BOOTSTRAP_STALL)
      stop_owned_tor "$pid" || true
      write_state FAILED SOCKS "$pid" "$port" "$session" "$started" '' "$transport" "$candidate" "$requested_transport" "$exit_policy" "$exit_country" "$data_dir" "$attempt_log"
      warn "$classification: $transport candidate $candidate stalled at ${percent}% for ${STALL_TIMEOUT}s."
      safe_remove_data_dir "$data_dir" 2>/dev/null || true
      return 1
    fi'''
          new = '''    stall_limit=$(stall_timeout_for_percent "$percent")
    if [ $(( $(now_epoch) - last_progress_epoch )) -ge "$stall_limit" ]; then
      classification=$(classify_attempt_failure "$transport" "$attempt_log" BOOTSTRAP_STALL)
      stop_owned_tor "$pid" || true
      write_state FAILED SOCKS "$pid" "$port" "$session" "$started" '' "$transport" "$candidate" "$requested_transport" "$exit_policy" "$exit_country" "$data_dir" "$attempt_log"
      warn "$classification: $transport candidate $candidate stalled at ${percent}% for ${stall_limit}s."
      safe_remove_data_dir "$data_dir" 2>/dev/null || true
      return 1
    fi'''
          if old not in s:
              raise SystemExit("CLI stall loop pattern missing")
          s = s.replace(old, new, 1)
          cli.write_text(s)

          Path("tunnel/VERSION").write_text("0.3.0-rc2\n")

          test = Path("tests/test_devfix_tunnel.sh")
          s = test.read_text().replace("0.3.0-rc1", "0.3.0-rc2")
          old = 'obfs4\\t1\\tobfs4 192.0.2.40:443 CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC cert=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA iat-mode=0\n'
          new = old + '''obfs4\\t2\\tobfs4 192.0.2.41:443 DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD cert=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB iat-mode=0
obfs4\\t3\\tobfs4 192.0.2.42:443 EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE cert=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC iat-mode=0
obfs4\\t4\\tobfs4 192.0.2.43:443 FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF cert=DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD iat-mode=0
obfs4\\t5\\tobfs4 192.0.2.44:443 1111111111111111111111111111111111111111 cert=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE iat-mode=0
obfs4\\t6\\tobfs4 192.0.2.45:443 2222222222222222222222222222222222222222 cert=FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF iat-mode=0
obfs4\\t7\\tobfs4 192.0.2.46:443 3333333333333333333333333333333333333333 cert=11111111111111111111111111111111111111111111111111111111111111111111 iat-mode=0
'''
          if old not in s:
              raise SystemExit("test catalog obfs4 insertion point missing")
          s = s.replace(old, new, 1)

          old = 'grep -Fq \'ExcludeExitNodes {ir},{??}\' "$DEVFIX_TUNNEL_STATE_DIR/run/torrc" || fail "foreign-only exclusion missing"\n'
          new = 'grep -Fq \'GeoIPExcludeUnknown 0\' "$DEVFIX_TUNNEL_STATE_DIR/run/torrc" || fail "unknown-country bridge isolation missing"\nif grep -Fq \'GeoIPExcludeUnknown 1\' "$DEVFIX_TUNNEL_STATE_DIR/run/torrc"; then fail "unknown-country policy still applies to entry bridges"; fi\n' + old
          if old not in s:
              raise SystemExit("foreign policy assertion insertion point missing")
          s = s.replace(old, new, 1)

          marker = '''pass "V5 bounded Snowflake-to-meek fallback and attempt logging"
new_case doctor'''
          deep = '''pass "V5 bounded Snowflake-to-meek fallback and attempt logging"

FAKE_TOR_DEEP="$TMP/fake-tor-deep"
cat > "$FAKE_TOR_DEEP" <<'EOF'
#!/bin/bash
torrc=""
while [ "$#" -gt 0 ]; do
  if [ "$1" = "-f" ] && [ "$#" -ge 2 ]; then torrc="$2"; break; fi
  shift
done
bridge=$(grep '^Bridge ' "$torrc" 2>/dev/null || true)
case "$bridge" in
  *'192.0.2.42:443'*)
    printf '%s\\n' 'Bootstrapped 10% (conn_done): Connected to a relay'
    printf '%s\\n' 'Bootstrapped 30% (loading_status): Loading networkstatus consensus'
    printf '%s\\n' 'Bootstrapped 100% (done): Done'
    while :; do /bin/sleep 1; done
    ;;
  *)
    printf '%s\\n' 'Bootstrapped 10% (conn_done): Connected to a relay'
    while :; do /bin/sleep 1; done
    ;;
esac
EOF
chmod +x "$FAKE_TOR_DEEP"

new_case v5_full_catalog
DEVFIX_TUNNEL_TOR_BIN="$FAKE_TOR_DEEP" DEVFIX_TUNNEL_STALL_TIMEOUT=1 DEVFIX_TUNNEL_BOOTSTRAP_TIMEOUT=5 DEVFIX_TUNNEL_MAX_AUTO_ATTEMPTS=0 \\
  "$TUNNEL" connect socks --transport auto > "$CASE/connect.out" 2>&1 || { cat "$CASE/connect.out" >&2; fail "full catalog fallback connect"; }
grep -q 'Transport attempt 6: obfs4 candidate 3' "$CASE/connect.out" || fail "auto mode stopped before later obfs4 candidates"
grep -q 'Transport ready: obfs4 candidate 3' "$CASE/connect.out" || fail "later obfs4 candidate was not accepted"
grep -q '^TRANSPORT=obfs4$' "$DEVFIX_TUNNEL_STATE_DIR/run/state" || fail "deep fallback transport state"
grep -q '^CANDIDATE=3$' "$DEVFIX_TUNNEL_STATE_DIR/run/state" || fail "deep fallback candidate state"
"$TUNNEL" disconnect >/dev/null 2>&1 || fail "deep fallback cleanup"
pass "V5 auto mode exhausts catalog beyond the former five-attempt ceiling"

new_case doctor'''
          if marker not in s:
              raise SystemExit("deep fallback insertion point missing")
          s = s.replace(marker, deep, 1)
          test.write_text(s)

          tor_test = Path("tests/test_devfix_tunnel_tor_config.sh")
          s = tor_test.read_text()
          if "GeoIPExcludeUnknown 1" not in s:
              raise SystemExit("real Tor config old unknown policy missing")
          tor_test.write_text(s.replace("GeoIPExcludeUnknown 1", "GeoIPExcludeUnknown 0"))

          chrome_test = Path("tests/test_devfix_tunnel_chrome.sh")
          chrome_test.write_text(chrome_test.read_text().replace("0.3.0-rc1", "0.3.0-rc2"))

          pkgwf = Path(".github/workflows/tunnel-package.yml")
          pkgwf.write_text(pkgwf.read_text().replace("0.3.0-rc1", "0.3.0-rc2"))

          readme = Path("tunnel/README.md")
          s = readme.read_text().replace("0.3.0-rc1", "0.3.0-rc2")
          anchor = "V5 removes that single-route dependency. The exact packaged Tor bundle is now the source of truth for the transport catalog.\n"
          note = "\nPhysical testing of `0.3.0-rc1` exposed a second resilience class: `GeoIPExcludeUnknown 1` could classify unknown-country entry bridges as excluded, the auto engine stopped after five candidates even when more obfs4 bridges existed, and a fixed 90-second no-progress cutoff was too aggressive for consensus loading. `0.3.0-rc2` separates exit-only country policy from entry-bridge eligibility, exhausts the packaged catalog by default, and uses phase-aware stall limits.\n"
          if anchor not in s:
              raise SystemExit("README RC2 note anchor missing")
          readme.write_text(s.replace(anchor, anchor + note, 1))

          rem = Path("docs/tunnel/remediations")
          rem.mkdir(parents=True, exist_ok=True)
          (rem / "012_REAL_MAC_UNKNOWN_BRIDGE_EXCLUSION.md").write_text("""# 012 — REAL_MAC_UNKNOWN_BRIDGE_EXCLUSION\n\nPhysical Monterey `0.3.0-rc1` logs repeatedly reported `Not using bridge ... it is in ExcludeNodes` for Snowflake and meek while foreign-only mode was enabled. Root cause: `GeoIPExcludeUnknown 1` makes unknown-country nodes excluded in both node and exit selection. Fix: use `GeoIPExcludeUnknown 0` and keep explicit `ExcludeExitNodes {ir},{??}` so unknown exits remain rejected without excluding entry bridges.\n""")
          (rem / "013_REAL_MAC_AUTO_CATALOG_TRUNCATION.md").write_text("""# 013 — REAL_MAC_AUTO_CATALOG_TRUNCATION\n\nPhysical Monterey `0.3.0-rc1` showed auto mode stopped after five attempts: two Snowflake, one meek, and only two obfs4 candidates, despite seven packaged obfs4 candidates. Root cause: default `MAX_AUTO_ATTEMPTS=5`. Fix: default `0` means exhaust the finite packaged catalog; an explicit positive environment override may still bound attempts for tests/operators. A regression test requires success on obfs4 candidate 3 after five prior failures.\n""")
          (rem / "014_REAL_MAC_PHASE_AWARE_BOOTSTRAP_STALL.md").write_text("""# 014 — REAL_MAC_PHASE_AWARE_BOOTSTRAP_STALL\n\nPhysical Monterey `0.3.0-rc1` reached Tor bootstrap 30% on obfs4 candidate 2 and was terminated after 90 seconds without a percentage change. Tor documents consensus loading as a phase that can take a while. Fix: retain a 90s initial stall limit, use 150s once relay handshake progress reaches 10%, and 240s from consensus-request/loading progress (>=25%), while preserving the explicit `DEVFIX_TUNNEL_STALL_TIMEOUT` override for deterministic tests.\n""")
          PY

      - name: Syntax and ShellCheck
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          bash -n tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tests/test_devfix_tunnel.sh tests/test_devfix_tunnel_chrome.sh tests/test_devfix_tunnel_tor_config.sh
          shellcheck -x tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tunnel/pkg/preinstall tunnel/pkg/postinstall tunnel/portable-install.sh tunnel/uninstall.sh tests/test_devfix_tunnel.sh tests/test_devfix_tunnel_chrome.sh tests/test_devfix_tunnel_tor_config.sh

      - name: RC2 regression tests
        run: |
          bash tests/test_devfix_tunnel.sh
          bash tests/test_devfix_tunnel_chrome.sh

      - name: Commit RC2 remediation
        run: |
          git config user.name "Amir Shahbazi"
          git config user.email "36712410+Shahbazi-Amir@users.noreply.github.com"
          git add tunnel tests .github/workflows/tunnel-package.yml docs/tunnel/remediations
          git diff --cached --check
          git commit -m "fix(tunnel): harden rc2 bridge policy and fallback"
          git push origin HEAD:feature/devfix-tunnel
