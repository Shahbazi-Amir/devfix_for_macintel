name: DevFix 2.0.2 reliability fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/devfix-202-reliability-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply comprehensive patch
        run: python3 .github/bootstrap/devfix_202_patch.py
      - name: Validate patch before commit
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
          bash tests/test_devfix.sh
          bash tests/test_install.sh
          git diff --check
      - name: Commit patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Snowflake reliability on Intel Monterey upgrades'
          git push origin HEAD:main
