name: DevFix 2.0.2 reliability fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/devfix-202-reliability-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply comprehensive 2.0.2 reliability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, got {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              s = p.read_text()
              ns, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, got {n}: {pattern[:120]!r}')
              p.write_text(ns)

          # Version.
          Path('VERSION').write_text('2.0.2\n')
          replace_once('bin/devfix', 'DEVFIX_VERSION="2.0.1"', 'DEVFIX_VERSION="2.0.2"')
          replace_once(
              'bin/devfix',
              'DEVFIX_BOOTSTRAP_TIMEOUT="${DEVFIX_BOOTSTRAP_TIMEOUT:-75}"\nDEVFIX_TEST_MODE="${DEVFIX_TEST_MODE:-0}"',
              'DEVFIX_BOOTSTRAP_TIMEOUT="${DEVFIX_BOOTSTRAP_TIMEOUT:-600}"\nDEVFIX_BOOTSTRAP_STALL_TIMEOUT="${DEVFIX_BOOTSTRAP_STALL_TIMEOUT:-180}"\nDEVFIX_TEST_MODE="${DEVFIX_TEST_MODE:-0}"'
          )

          # Distinguish missing payload from legacy permissions.
          replace_once(
              'bin/devfix',
              '''snowflake_available() {\n  [ -x "$DEVFIX_TOR_BIN" ] && [ -x "$DEVFIX_LYREBIRD_BIN" ]\n}\n''',
              '''snowflake_available() {\n  [ -x "$DEVFIX_TOR_BIN" ] && [ -x "$DEVFIX_LYREBIRD_BIN" ]\n}\n\nsnowflake_payload_state() {\n  if snowflake_available; then\n    printf 'available'\n  elif [ -d "$DEVFIX_LIBEXEC_DIR/tor" ] && [ ! -x "$DEVFIX_LIBEXEC_DIR/tor" ]; then\n    printf 'inaccessible'\n  elif [ -d "$DEVFIX_LIBEXEC_DIR/tor" ]; then\n    printf 'incomplete'\n  else\n    printf 'missing'\n  fi\n}\n'''
          )

          # Tor logs to stdout; the parent shell owns the actual log file.
          replace_once('bin/devfix', '  q_log=$(torrc_quote "$DEVFIX_TOR_LOG")\n  q_pt=$(torrc_quote "$DEVFIX_LYREBIRD_BIN")', '  q_pt=$(torrc_quote "$DEVFIX_LYREBIRD_BIN")')
          replace_once('bin/devfix', 'Log notice file $q_log', 'Log notice stdout')

          old_loop = r'''  elapsed=0\n  while \[ "\$elapsed" -lt "\$DEVFIX_BOOTSTRAP_TIMEOUT" \]; do\n.*?  warn "TRANSPORT_FAILURE: Snowflake could not establish a working route\."\n  return 1'''
          new_loop = '''  elapsed=0
  last_progress=""
  last_progress_at=0
  while [ "$elapsed" -lt "$DEVFIX_BOOTSTRAP_TIMEOUT" ]; do
    if ! is_pid_alive "$pid"; then
      tail -n 30 "$DEVFIX_TOR_LOG" >&2 2>/dev/null || true
      clear_state
      warn "TRANSPORT_FAILURE: Snowflake/Tor exited before bootstrap completed."
      return 1
    fi

    latest_progress=$(grep 'Bootstrapped [0-9][0-9]*%' "$DEVFIX_TOR_LOG" 2>/dev/null | tail -n 1)
    if [ -n "$latest_progress" ] && [ "$latest_progress" != "$last_progress" ]; then
      progress_text=$(printf '%s\\n' "$latest_progress" | sed 's/^.*Bootstrapped /Bootstrapped /')
      info "Snowflake: $progress_text"
      last_progress="$latest_progress"
      last_progress_at="$elapsed"
    elif [ "$elapsed" -gt 0 ] && [ $((elapsed % 30)) -eq 0 ]; then
      info "Snowflake bootstrap still in progress (${elapsed}s/${DEVFIX_BOOTSTRAP_TIMEOUT}s)..."
    fi

    if grep -q 'Bootstrapped 100%' "$DEVFIX_TOR_LOG" 2>/dev/null && port_in_use "$port"; then
      if probe_critical_quiet snowflake; then
        ok "Connected with built-in Snowflake."
        log_line "transport=snowflake action=connected"
        return 0
      fi
    fi

    if [ -n "$last_progress" ] && [ $((elapsed - last_progress_at)) -ge "$DEVFIX_BOOTSTRAP_STALL_TIMEOUT" ]; then
      progress_text=$(printf '%s\\n' "$last_progress" | sed 's/^.*Bootstrapped /Bootstrapped /')
      stop_tor_pid "$pid"
      clear_state
      tail -n 30 "$DEVFIX_TOR_LOG" >&2 2>/dev/null || true
      warn "TRANSPORT_FAILURE: Snowflake stalled at $progress_text for ${DEVFIX_BOOTSTRAP_STALL_TIMEOUT}s."
      return 1
    fi

    sleep 1
    elapsed=$((elapsed + 1))
  done

  if [ -n "$last_progress" ]; then
    progress_text=$(printf '%s\\n' "$last_progress" | sed 's/^.*Bootstrapped /Bootstrapped /')
  else
    progress_text="no bootstrap progress reported"
  fi
  stop_tor_pid "$pid"
  clear_state
  tail -n 30 "$DEVFIX_TOR_LOG" >&2 2>/dev/null || true
  warn "TRANSPORT_FAILURE: Snowflake bootstrap timed out after ${DEVFIX_BOOTSTRAP_TIMEOUT}s at $progress_text."
  return 1'''
          sub_once('bin/devfix', old_loop, new_loop, flags=re.S)

          # Better payload diagnostics in transport list and doctor.
          replace_once(
              'bin/devfix',
              '''      if snowflake_available; then\n        printf 'snowflake       built-in   available\\n'\n      else\n        printf 'snowflake       built-in   not installed\\n'\n      fi''',
              '''      payload_state=$(snowflake_payload_state)\n      case "$payload_state" in\n        available) printf 'snowflake       built-in   available\\n' ;;\n        inaccessible) printf 'snowflake       built-in   inaccessible (permissions)\\n' ;;\n        incomplete) printf 'snowflake       built-in   incomplete payload\\n' ;;\n        *) printf 'snowflake       built-in   not installed\\n' ;;\n      esac'''
          )
          replace_once(
              'bin/devfix',
              '''  if snowflake_available; then\n    printf '  %-20s %s\\n' snowflake available\n  else\n    printf '  %-20s %s\\n' snowflake 'NOT INSTALLED'\n  fi''',
              '''  payload_state=$(snowflake_payload_state)\n  case "$payload_state" in\n    available) printf '  %-20s %s\\n' snowflake available ;;\n    inaccessible) printf '  %-20s %s\\n' snowflake 'INACCESSIBLE (permissions)' ;;\n    incomplete) printf '  %-20s %s\\n' snowflake 'INCOMPLETE PAYLOAD' ;;\n    *) printf '  %-20s %s\\n' snowflake 'NOT INSTALLED' ;;\n  esac'''
          )
          replace_once(
              'bin/devfix',
              '''  elif snowflake_available; then\n    printf 'Primary issue: NETWORK_BLOCKED_OR_UNREACHABLE\\n'\n    printf 'Recommendation: run devfix connect; auto mode will try built-in Snowflake.\\n'\n  else\n    printf 'Primary issue: NETWORK_BLOCKED_OR_UNREACHABLE\\n'\n    printf 'Recommendation: reinstall the self-contained DevFix package; Snowflake payload is missing.\\n'\n  fi''',
              '''  elif snowflake_available; then\n    printf 'Primary issue: PARTIAL_DEVELOPER_NETWORK\\n'\n    printf 'Recommendation: run devfix connect; auto mode will try built-in Snowflake for required endpoints.\\n'\n  elif [ "$(snowflake_payload_state)" = "inaccessible" ]; then\n    printf 'Primary issue: SNOWFLAKE_PAYLOAD_PERMISSIONS\\n'\n    printf 'Recommendation: install the latest DevFix package; its upgrade repair fixes legacy payload permissions.\\n'\n  else\n    printf 'Primary issue: NETWORK_BLOCKED_OR_UNREACHABLE\\n'\n    printf 'Recommendation: reinstall the self-contained DevFix package; Snowflake payload is missing or incomplete.\\n'\n  fi'''
          )
          replace_once('bin/devfix', 'DevFix 2.0.0 - built-in developer-network routing for Intel macOS', 'DevFix - built-in developer-network routing for Intel macOS')

          # Portable installer: normalize payload permissions after copy.
          replace_once(
              'install.sh',
              'as_root cp -R "$TOR_SOURCE" "$TARGET/libexec/devfix/tor"\nas_root cp "$ROOT/share/man/man1/devfix.1"',
              'as_root cp -R "$TOR_SOURCE" "$TARGET/libexec/devfix/tor"\nas_root chmod -R a+rX "$TARGET/libexec/devfix/tor"\nas_root cp "$ROOT/share/man/man1/devfix.1"'
          )

          # Vendor payload itself should never carry a private directory mode into a package.
          replace_once(
              'scripts/fetch-tor-bundle.sh',
              'cp -R "$source_dir" "$DEST"\nchmod +x "$DEST/tor" "$DEST/pluggable_transports/lyrebird"',
              'cp -R "$source_dir" "$DEST"\nchmod -R a+rX "$DEST"\nchmod +x "$DEST/tor" "$DEST/pluggable_transports/lyrebird"'
          )

          # Package root + postinstall repair. Recommended ownership avoids runner-user ownership leakage.
          replace_once(
              'scripts/build-pkg.sh',
              'cp -R "$VENDOR" "$PKGROOT/usr/local/libexec/devfix/tor"\ncp "$ROOT/man/devfix.1"',
              'cp -R "$VENDOR" "$PKGROOT/usr/local/libexec/devfix/tor"\nchmod -R a+rX "$PKGROOT/usr/local/libexec/devfix/tor"\ncp "$ROOT/man/devfix.1"'
          )
          replace_once(
              'scripts/build-pkg.sh',
              'chmod 755 "$DEVFIX" "$TOR" "$LYREBIRD"',
              'chmod -R a+rX /usr/local/libexec/devfix/tor\nchmod 755 "$DEVFIX" "$TOR" "$LYREBIRD"'
          )
          replace_once('scripts/build-pkg.sh', '--ownership preserve', '--ownership recommended')

          # Unit regression tests: legacy permissions and single-owner Tor logging.
          replace_once(
              'tests/test_devfix.sh',
              '''assert_contains "snowflake available" "available" "$out"\n\nout=$("$DEVFIX" proxy status)''',
              '''assert_contains "snowflake available" "available" "$out"\n\nchmod 600 "$TMP/libexec/tor"\nout=$("$DEVFIX" transport list)\nassert_contains "snowflake permission diagnosis" "inaccessible (permissions)" "$out"\nchmod 755 "$TMP/libexec/tor"\n\nout=$("$DEVFIX" proxy status)'''
          )
          replace_once(
              'tests/test_devfix.sh',
              '''"$DEVFIX" connect snowflake >/dev/null\nout=$("$DEVFIX" status)\nassert_contains "snowflake connected" "Transport: snowflake" "$out"''',
              '''"$DEVFIX" connect snowflake >/dev/null\nif grep -Fq 'Log notice stdout' "$DEVFIX_STATE_DIR/run/torrc"; then pass "tor logs to stdout"; else fail "tor logs to stdout"; fi\nif grep -Fq 'Log notice file' "$DEVFIX_STATE_DIR/run/torrc"; then fail "tor avoids direct log file"; else pass "tor avoids direct log file"; fi\nout=$("$DEVFIX" status)\nassert_contains "snowflake connected" "Transport: snowflake" "$out"'''
          )

          # Package CI: reproduce the exact legacy 700 root-owned parent directory before upgrade.
          replace_once(
              '.github/workflows/package.yml',
              '''          sudo /usr/local/share/devfix/uninstall.sh\n      - name: Portable artifact smoke test''',
              '''          sudo /usr/local/share/devfix/uninstall.sh\n      - name: Upgrade repairs legacy payload permissions\n        run: |\n          set -euo pipefail\n          version=$(cat VERSION)\n          pkg="dist/DevFix-${version}-macos-x86_64.pkg"\n          sudo rm -rf /usr/local/libexec/devfix /usr/local/share/devfix\n          sudo rm -f /usr/local/bin/devfix /usr/local/share/man/man1/devfix.1\n          sudo mkdir -p /usr/local/libexec/devfix/tor/pluggable_transports\n          sudo touch /usr/local/libexec/devfix/tor/legacy-marker\n          sudo chmod 700 /usr/local/libexec/devfix/tor\n          sudo chmod 700 /usr/local/libexec/devfix/tor/pluggable_transports\n          sudo installer -pkg "$pkg" -target /\n          test -x /usr/local/bin/devfix\n          test -x /usr/local/libexec/devfix/tor/tor\n          test -x /usr/local/libexec/devfix/tor/pluggable_transports/lyrebird\n          test "$(stat -f '%Lp' /usr/local/libexec/devfix/tor)" = "755"\n          /usr/local/bin/devfix transport list | grep -E 'snowflake.*available'\n          sudo /usr/local/share/devfix/uninstall.sh\n      - name: Portable artifact smoke test'''
          )

          # Changelog and man page.
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''# Changelog\n\n## 2.0.2 - 2026-08-15\n\n- Fixed upgrades that could leave the bundled Tor directory root-only and make Snowflake look uninstalled.\n- Normalized Tor payload permissions in source fetch, tar installation, package build, and package postinstall repair.\n- Changed Tor notice logging to stdout with DevFix owning the log redirection, avoiding Monterey log-file initialization failures.\n- Added progress-aware Snowflake bootstrap with a 10-minute hard limit and a 3-minute no-progress stall limit.\n- Improved diagnostics for inaccessible versus missing Snowflake payloads and partial developer-network reachability.\n- Added a package-upgrade regression test that reproduces the legacy root-owned mode-700 directory.\n\n'''
          if not s.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG.md: unexpected header')
          p.write_text(entry + s[len('# Changelog\n\n'):])
          replace_once('man/devfix.1', '"DevFix 2.0.0"', '"DevFix 2.0.2"')

          # Remove this one-shot workflow from the resulting patch commit.
          Path('.github/workflows/devfix-202-reliability-fix.yml').unlink()
          PY

          bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
          bash tests/test_devfix.sh
          bash tests/test_install.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Snowflake reliability on Intel Monterey upgrades'
          git push origin HEAD:main
