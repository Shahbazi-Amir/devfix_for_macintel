name: One-time main documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-finalize-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary connector files and self-clean
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch docs/.connector-write-test.tmp
          git rm -f --ignore-unmatch .github/workflows/cleanup-connector-probe.yml
          git rm -f .github/workflows/main-finalize-docs.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: finalize documentation cleanup'
          git push origin HEAD:main
