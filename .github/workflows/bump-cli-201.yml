name: Bump DevFix CLI 2.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump CLI version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bin/devfix')
          s = p.read_text()
          old = 'DEVFIX_VERSION="2.0.0"'
          new = 'DEVFIX_VERSION="2.0.1"'
          if old not in s:
              raise SystemExit('2.0.0 version marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n bin/devfix
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/devfix
          git commit -m 'Bump DevFix CLI to 2.0.1'
          git push origin HEAD:main
