name: DevFix Tunnel CI

on:
  push:
    branches: [feature/devfix-tunnel]
    paths: ["tunnel/**", "tests/test_devfix_tunnel*.sh", "docs/tunnel/**", ".github/workflows/tunnel-ci.yml"]
  pull_request:
    paths: ["tunnel/**", "tests/test_devfix_tunnel*.sh", "docs/tunnel/**", ".github/workflows/tunnel-ci.yml"]

permissions:
  contents: read

jobs:
  tunnel-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: |
          bash -n tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tunnel/pkg/preinstall tunnel/pkg/postinstall tunnel/portable-install.sh tunnel/uninstall.sh tests/test_devfix_tunnel.sh tests/test_devfix_tunnel_chrome.sh tests/test_devfix_tunnel_tor_config.sh
      - name: ShellCheck
        run: shellcheck -x tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tunnel/pkg/preinstall tunnel/pkg/postinstall tunnel/portable-install.sh tunnel/uninstall.sh tests/test_devfix_tunnel.sh tests/test_devfix_tunnel_chrome.sh tests/test_devfix_tunnel_tor_config.sh
      - run: bash tests/test_devfix_tunnel.sh
      - run: bash tests/test_devfix_tunnel_chrome.sh

  macos-command-contract:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Required macOS commands
        run: |
          test -x /usr/sbin/networksetup
          test -x /sbin/route
          test -x /usr/bin/nohup
          /usr/sbin/networksetup -help 2>&1 | grep -q -- "-getsocksfirewallproxy"
          /usr/sbin/networksetup -help 2>&1 | grep -q -- "-setsocksfirewallproxy"
          /usr/sbin/networksetup -help 2>&1 | grep -q -- "-getautoproxyurl"
          /usr/sbin/networksetup -help 2>&1 | grep -q -- "-getproxyautodiscovery"
          /usr/sbin/networksetup -help 2>&1 | grep -q -- "-listnetworkserviceorder"
          sudo -n -u "#$(id -u)" /usr/bin/true
      - run: bash -n tunnel/cli/devfix-tunnel tunnel/libexec/devfix-tunnel-guardian tunnel/scripts/*.sh tests/test_devfix_tunnel.sh tests/test_devfix_tunnel_chrome.sh tests/test_devfix_tunnel_tor_config.sh
      - run: bash tests/test_devfix_tunnel.sh
      - run: bash tests/test_devfix_tunnel_chrome.sh

  inherited-devfix-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/test_devfix.sh tests/test_install.sh
      - run: bash tests/test_devfix.sh
      - run: bash tests/test_install.sh
