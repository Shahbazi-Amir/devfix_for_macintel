name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Tests
        run: ./tests/test_devfix.sh
      - name: Version consistency
        run: test "$(cat VERSION)" = "$(./bin/devfix version)"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -x bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
