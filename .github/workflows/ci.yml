name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Core tests
        run: bash tests/test_devfix.sh
      - name: Installer smoke test
        run: bash tests/test_install.sh
      - name: Version consistency
        run: |
          version=$(cat VERSION)
          ./bin/devfix --version | grep -F "DevFix ${version}"
