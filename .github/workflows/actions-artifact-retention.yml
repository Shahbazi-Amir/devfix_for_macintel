name: Actions Artifact Retention

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inventory and report without deleting artifacts
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [feature/devfix-tunnel-ui]
    paths:
      - '.github/workflows/actions-artifact-retention.yml'
      - '.github/artifact-governance.json'
      - '.github/scripts/artifact_cleanup.py'
      - '.github/scripts/artifact_storage_monitor.py'

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: actions-artifact-retention-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DASHBOARD_ISSUE: '1'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PROTECTED_ARTIFACT_IDS: '9269052322,9274817412'
    steps:
      - uses: actions/checkout@v4

      - name: Inventory, conservative cleanup, and dashboard update
        run: python3 .github/scripts/artifact_cleanup.py

      - name: Publish storage and workflow monitor
        run: python3 .github/scripts/artifact_storage_monitor.py
