name: Final ShellCheck cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove final lint-only annotation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bin/devfix')
          s = p.read_text()
          old = "    printf \"%s\\n\" 'Recommendation: run `devfix connect`; auto mode will try built-in Snowflake.'\n"
          new = "    printf 'Recommendation: run devfix connect; auto mode will try built-in Snowflake.\\n'\n"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n bin/devfix
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/devfix
          git commit -m 'Resolve final ShellCheck annotation'
          git push origin HEAD:main
