name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Test
        run: ./tests/test_devfix.sh
      - name: Build
        run: ./scripts/build-pkg.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/DevFix-*.pkg dist/DevFix-*.tar.gz dist/SHA256SUMS --generate-notes --title "DevFix $(cat VERSION)"
