name: One-time connector cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-connector-probe.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary connector probe and self-clean
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch docs/.connector-write-test.tmp
          git rm -f .github/workflows/cleanup-connector-probe.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove temporary connector probe'
          git push origin HEAD:main
