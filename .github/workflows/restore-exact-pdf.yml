name: Restore Exact QAed Persian PDF

on:
  push:
    branches:
      - feature/devfix-tunnel
    paths:
      - '.github/bootstrap/exact-pdf.trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact QAed PDF
        run: |
          cat .github/bootstrap/exact-pdf.part1 .github/bootstrap/exact-pdf.part2 | base64 --decode > docs/DevFix_User_Guide_FA.pdf
          test -s docs/DevFix_User_Guide_FA.pdf
          actual=$(sha256sum docs/DevFix_User_Guide_FA.pdf | awk '{print $1}')
          expected='1ca9ca748e4e4a5cf661bf7e960265080fa50d07f545179d32ac212f78c48026'
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
      - name: Commit exact PDF and clean bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/bootstrap/exact-pdf.trigger .github/bootstrap/exact-pdf.part1 .github/bootstrap/exact-pdf.part2
          rm -f .github/workflows/restore-exact-pdf.yml
          git add docs/DevFix_User_Guide_FA.pdf .github/bootstrap .github/workflows
          git commit -m "docs: preserve exact QAed Persian PDF"
          git push origin HEAD:feature/devfix-tunnel
