name: DevFix Tunnel UI

on:
  workflow_dispatch:
  push:
    branches: [feature/devfix-tunnel-ui, feature/devfix-tunnel-smart-routing]
    paths:
      - "tunnel/ui/**"
      - "tunnel/scripts/build-ui-app.sh"
      - ".github/workflows/tunnel-ui.yml"

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked controller boundary
        run: |
          test "$(cat tunnel/VERSION)" = "0.4.0-rc1"
          grep -F 'TUNNEL_VERSION="0.4.0-rc1"' tunnel/cli/devfix-tunnel
          grep -F 'SMART_IR_DIRECT' tunnel/cli/devfix-tunnel
          grep -F 'SMART_BYPASS_DOMAINS' tunnel/libexec/devfix-tunnel-guardian

      - name: Verify smart-routing UI contract
        run: |
          grep -F 'Connect Browsers (Smart)' tunnel/ui/DevFixTunnelMenuBar.swift
          grep -F 'Smart Browser Mode (System Proxy)' tunnel/ui/DevFixTunnelMenuBar.swift
          grep -F 'Open Tor Check in Safari' tunnel/ui/DevFixTunnelMenuBar.swift
          grep -F 'WAITING FOR TERMINAL AUTHORIZATION' tunnel/ui/DevFixTunnelMenuBar.swift
          grep -F 'Legacy: Open Selective Chrome' tunnel/ui/DevFixTunnelMenuBar.swift

      - name: Build native menu bar app
        run: bash tunnel/scripts/build-ui-app.sh

      - name: Verify app bundle
        run: |
          APP="build/tunnel-ui/DevFix Tunnel.app"
          ZIP="build/tunnel-ui/DevFixTunnel-0.4.0-rc1-smart-routing-macos-x86_64.zip"
          test -x "$APP/Contents/MacOS/DevFixTunnelUI"
          plutil -lint "$APP/Contents/Info.plist"
          /usr/bin/file "$APP/Contents/MacOS/DevFixTunnelUI" | grep -F "x86_64"
          codesign --verify --deep --strict "$APP"
          test -s "$ZIP"
          shasum -a 256 "$ZIP" | tee build/tunnel-ui/UI_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DevFixTunnel-0.4.0-rc1-smart-routing-macos-x86_64
          path: |
            build/tunnel-ui/DevFixTunnel-0.3.0-rc3-safari-preview-macos-x86_64.zip
            build/tunnel-ui/UI_SHA256.txt
          if-no-files-found: error
          retention-days: 14
