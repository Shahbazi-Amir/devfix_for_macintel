name: Fix version tests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make version tests dynamic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/test_devfix.sh')
          s=p.read_text()
          s=s.replace('assert_eq "version" "DevFix 2.0.0" "$out"','assert_eq "version" "DevFix $(cat "$ROOT/VERSION")" "$out"',1)
          p.write_text(s)
          p=Path('tests/test_install.sh')
          s=p.read_text()
          s=s.replace('[ "$("$DEST/usr/local/bin/devfix" --version)" = "DevFix 2.0.0" ]','[ "$("$DEST/usr/local/bin/devfix" --version)" = "DevFix $(cat "$ROOT/VERSION")" ]',1)
          p.write_text(s)
          PY
          bash -n tests/test_devfix.sh tests/test_install.sh
          bash tests/test_devfix.sh
          bash tests/test_install.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_devfix.sh tests/test_install.sh
          git commit -m 'Make tests follow VERSION file'
          git push origin HEAD:main
