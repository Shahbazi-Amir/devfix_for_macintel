name: DevFix 2.0.3 managed transport fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/devfix-203-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2.0.3 patch
        run: |
          set -euo pipefail
          python3 .github/bootstrap/devfix_203_patch.py
          git checkout HEAD -- .github/workflows/devfix-203-fix.yml
      - name: Validate
        run: |
          set -euo pipefail
          bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
          bash tests/test_devfix.sh
          bash tests/test_install.sh
          git diff --check
      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix lyrebird managed transport launch on Monterey'
          git push origin HEAD:main
# retry after exact regression insertion fix
