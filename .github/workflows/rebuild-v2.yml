name: Rebuild DevFix 2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore tested DevFix 2.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/aa \
            .bootstrap/ab1 \
            .bootstrap/ab2 \
            .bootstrap/ab3 \
            .bootstrap/ac \
            .bootstrap/ad \
            .bootstrap/ae > /tmp/devfix-source.b64
          base64 --decode /tmp/devfix-source.b64 > /tmp/devfix-source.tgz
          echo '8a1c03bbe7ac2aa22ca60388556e8a0e1903f6c806a67e12a8ce73be039082fd  /tmp/devfix-source.tgz' | sha256sum --check --strict
          tar -tzf /tmp/devfix-source.tgz >/dev/null

          mkdir -p /tmp/devfix-old-workflows
          cp -R .github/workflows/. /tmp/devfix-old-workflows/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/devfix-source.tgz -C .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -R /tmp/devfix-old-workflows/. .github/workflows/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Rebuild DevFix 2.0.0 with built-in Snowflake'
          git push origin HEAD:main
