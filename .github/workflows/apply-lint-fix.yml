name: Apply DevFix lint patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested lint fix
        shell: bash
        run: |
          set -euo pipefail
          cat .lintpatch/p1 .lintpatch/p2 .lintpatch/p3 > /tmp/devfix-lint.patch
          git apply --check /tmp/devfix-lint.patch
          git apply /tmp/devfix-lint.patch
          rm -rf .lintpatch
          bash -n bin/devfix install.sh uninstall.sh scripts/*.sh tests/*.sh
          bash tests/test_devfix.sh
          bash tests/test_install.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix ShellCheck issues in DevFix 2.0'
          git push origin HEAD:main
